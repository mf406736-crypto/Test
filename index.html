<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AMANBRA</title>
<style>
:root{--bg:#0d2410;--fg:#e8f5d8;--btn:rgba(232,245,216,.22)}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden}
body{touch-action:none;user-select:none;-webkit-user-select:none;font-family:"Trebuchet MS",Verdana,sans-serif}
canvas{position:fixed;left:0;top:0;image-rendering:pixelated;background:#4d9a35}
button{font-family:inherit;color:var(--fg);background:var(--btn);border:2px solid var(--fg);touch-action:none;-webkit-tap-highlight-color:transparent}
button:active{background:var(--fg);color:var(--bg)}
#pad{position:fixed;left:calc(14px + env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,64px);gap:6px}
#pad button{border-radius:12px;font-size:24px}
#pad .u{grid-column:2;grid-row:1}#pad .l{grid-column:1;grid-row:2}#pad .d{grid-column:2;grid-row:2}#pad .r{grid-column:3;grid-row:2}
#act{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;align-items:flex-end;gap:14px}
#act .jump{width:92px;height:92px;border-radius:50%;font-size:15px;font-weight:bold;letter-spacing:1px}
#act .run{width:66px;height:66px;border-radius:50%;font-size:12px;font-weight:bold;margin-bottom:6px}
#fs{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));width:42px;height:42px;border-radius:10px;font-size:20px;opacity:.7}
@media (pointer:fine){#pad,#act{display:none}}
body:not(.play) #pad,body:not(.play) #act{visibility:hidden}
#fs{z-index:30}
#menu{position:fixed;inset:0;z-index:20;background:#0d2410;overflow:hidden}
#menu img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;image-rendering:pixelated}
#jogar{position:absolute;left:calc(4% + env(safe-area-inset-left,0px));top:32%;display:flex;align-items:center;gap:10px;background:rgba(8,26,10,.55);border:0;padding:10px 16px 10px 12px;cursor:pointer}
#jogar canvas{position:static;background:none;image-rendering:pixelated;display:block}
#jogar .arr{width:0;height:0;border-style:solid;border-width:9px 0 9px 14px;border-color:transparent transparent transparent #f4d640;animation:bl 1s steps(2) infinite}
#jogar:hover,#jogar:focus-visible{background:rgba(8,26,10,.8);outline:2px solid #f4d640}
@keyframes bl{50%{opacity:0}}
</style>
</head>

<script>

const cv=document.getElementById('c'),g=cv.getContext('2d');
g.imageSmoothingEnabled=false;
let W=320,H=240;const T=16;
function resize(){const S=Math.max(2,Math.round(Math.min(innerWidth,innerHeight)/240));W=Math.ceil(innerWidth/S);H=Math.ceil(innerHeight/S);cv.width=W;cv.height=H;cv.style.width=W*S+'px';cv.style.height=H*S+'px';g.imageSmoothingEnabled=false}
resize();addEventListener('resize',resize);addEventListener('orientationchange',resize);
document.getElementById('fs').addEventListener('click',()=>{const e=document.documentElement,r=e.requestFullscreen||e.webkitRequestFullscreen;try{if(document.fullscreenElement||document.webkitFullscreenElement)(document.exitFullscreen||document.webkitExitFullscreen).call(document);else if(r)r.call(e)}catch(_){}});

/* ---- menu principal ---- */
let started=false;
(function(){
  const G5={J:['00111','00010','00010','00010','00010','10010','01100'],O:['01110','10001','10001','10001','10001','10001','01110'],G:['01110','10001','10000','10111','10001','10001','01111'],A:['01110','10001','10001','11111','10001','10001','10001'],R:['11110','10001','10001','11110','10100','10010','10001']};
  const t=document.getElementById('jtxt'),x=t.getContext('2d'),word='JOGAR';
  t.width=word.length*6+2;t.height=10;
  const draw=(ox,oy,col)=>{x.fillStyle=col;[...word].forEach((ch,i)=>G5[ch].forEach((row,y)=>[...row].forEach((v,xx)=>{if(v==='1')x.fillRect(ox+i*6+xx,oy+y,1,1)})))};
  for(const [a,b] of [[0,1],[2,1],[1,0],[1,2],[0,0],[2,0],[0,2],[2,2]])draw(a,b,'#2a1a0c');
  draw(1,1,'#f6e7b4');
  const fit=()=>{const w=Math.min(innerWidth*.3,260),s=Math.max(3,Math.round(w/t.width));t.style.width=t.width*s+'px';t.style.height=t.height*s+'px'};
  fit();addEventListener('resize',fit);
})();
function startGame(){if(started)return;started=true;document.body.classList.add('play');document.getElementById('menu').style.display='none';last=performance.now()}
document.getElementById('jogar').addEventListener('click',startGame);
const SPEED=48;        // px/s (resolução lógica)
const STRIDE=3.5;      // px andados por frame de animação (pés acompanham o chão)
const FW=32,FH=32,NF=8;   // quadros 24x28, 8 frames
const ROW={down:0,left:1,right:2,up:3};
const IDLE={down:8,up:8,left:8,right:8};  // frame "parado" de cada direção
const FEET_ROW=30;     // última linha de pixels dos pés no sprite

/* ---- entrada ---- */
const keys={up:0,down:0,left:0,right:0,jump:0,run:0};
const KMAP={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',Space:'jump',ShiftLeft:'run',ShiftRight:'run'};
const KC={37:'left',38:'up',39:'right',40:'down',13:'jump',23:'jump',66:'jump',32:'jump',65376:'jump'};  // OK/centro do controle = Enter (13, 23, 66)
const kOf=e=>KMAP[e.code]||(e.key==='Enter'?'jump':null)||KC[e.keyCode];
const isOK=e=>e.code==='Enter'||e.code==='NumpadEnter'||e.code==='Space'||e.key==='Enter'||e.keyCode===13||e.keyCode===23||e.keyCode===66||e.keyCode===32;
let lastAxis='v';
const axisOf=k=>(k==='left'||k==='right')?'h':(k==='up'||k==='down')?'v':'x';
addEventListener('keydown',e=>{
  if(!started){if(isOK(e)){e.preventDefault();startGame()}return}
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const k=kOf(e);if(!k)return;
  e.preventDefault();
  if(!keys[k]&&axisOf(k)!=='x')lastAxis=axisOf(k);
  keys[k]=1;
});
addEventListener('keyup',e=>{const k=kOf(e);if(k){e.preventDefault();keys[k]=0}});
function releaseAll(){keys.up=keys.down=keys.left=keys.right=keys.jump=keys.run=0}
addEventListener('blur',releaseAll);
document.addEventListener('visibilitychange',()=>{if(document.hidden)releaseAll()});
document.querySelectorAll('[data-k]').forEach(b=>{
  const k=b.dataset.k;
  b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=1;if(axisOf(k)!=='x')lastAxis=axisOf(k);b.setPointerCapture(e.pointerId)});
  ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=0));
});
addEventListener('contextmenu',e=>e.preventDefault());
/* ---- gamepad (controle de videogame: direcional/analógico + A pula, X/B corre) ---- */
const gpPrev={up:0,down:0,left:0,right:0,jump:0,run:0};
function gpPoll(){
  const pads=navigator.getGamepads?navigator.getGamepads():[];
  for(const gp of pads){
    if(!gp)continue;
    const b=i=>gp.buttons[i]&&gp.buttons[i].pressed,ax=gp.axes||[];
    const now={up:b(12)||ax[1]<-.5,down:b(13)||ax[1]>.5,left:b(14)||ax[0]<-.5,right:b(15)||ax[0]>.5,jump:b(0),run:b(1)||b(2)||b(5)||b(7)};
    if(!started){if(now.jump||b(9))startGame();break}
    for(const k in now){const v=now[k]?1:0;if(v!==gpPrev[k]){gpPrev[k]=v;keys[k]=v;if(v&&axisOf(k)!=='x')lastAxis=axisOf(k)}}
    break;
  }
  requestAnimationFrame(gpPoll);
}
requestAnimationFrame(gpPoll);

/* ---- aleatório determinístico ---- */
function rnd(x,y){let h=Math.imul(x|0,374761393)^Math.imul(y|0,668265263);h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296}

/* ---- mundo: [1]=grama [2]=terra [3]=areia [4]=água [5]=lama ---- */
const GRASS=1,DIRT=2,SAND=3,WATER=4,MUD=5;var DA;
const G=8,N=512,WS=G*N,SEED=1337,RIM=104;
const FL=new Float32Array(N*N),FX=new Float32Array(N*N),FY=new Float32Array(N*N),DM=new Float32Array(N*N),DN=new Float32Array(N*N),SN=new Float32Array(N*N);
const springs=[],springRocks=[],lakeList=[],LID=new Uint16Array(N*N);let spawn={x:WS/2,y:WS/2};
function hs(x,y,s){let h=Math.imul(x|0,374761393)^Math.imul(y|0,668265263)^Math.imul(s|0,1274126177);h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296}
function vn(x,y,s){const xi=Math.floor(x),yi=Math.floor(y),fx=x-xi,fy=y-yi,u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy);
  const a=hs(xi,yi,s),b=hs(xi+1,yi,s),c=hs(xi,yi+1,s),d=hs(xi+1,yi+1,s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
function fbm(x,y,s){return vn(x,y,s)*.57+vn(x*2.1+7.7,y*2.1+3.1,s+1)*.29+vn(x*4.3+1.3,y*4.3+9.9,s+2)*.14}
const sst=(a,b,x)=>{x=Math.min(1,Math.max(0,(x-a)/(b-a)));return x*x*(3-2*x)};

function blur3(a){const o=new Float32Array(a.length);
  for(let j=1;j<N-1;j++)for(let i=1;i<N-1;i++){const k=j*N+i;o[k]=(a[k]*4+(a[k-1]+a[k+1]+a[k-N]+a[k+N])*2+a[k-N-1]+a[k-N+1]+a[k+N-1]+a[k+N+1])/16}
  a.set(o)}
function gen(){
  const NN=N*N,HT=new Float32Array(NN),dips=[];
  for(let k=0;k<7;k++)dips.push([hs(k,1,SEED)*N*.8+N*.1,hs(k,2,SEED)*N*.8+N*.1,9+hs(k,3,SEED)*9]);
  for(let j=0;j<N;j++)for(let i=0;i<N;i++){
    const o=j*N+i,x=i*G,y=j*G;
    let h=fbm(i/95,j/95,SEED+3)*.6+vn(i/30,j/30,SEED+4)*.08+(i*.55+j*.45)/N*.25;
    for(const d of dips){const r=Math.hypot(i-d[0],j-d[1])/d[2];if(r<1.7)h-=.05*Math.exp(-r*r*2.2)}
    HT[o]=h;DN[o]=fbm(x/110,y/110,SEED+14);SN[o]=fbm(x/130,y/130,SEED+15);
  }
  /* escoamento: priority-flood (preenche depressões → lagos) + D8 */
  const fill=new Float32Array(NN),down=new Int32Array(NN).fill(-1),seen=new Uint8Array(NN),order=new Int32Array(NN);

function shade(ids,dep,M,i,j,wx,wy){

const TP={o:'#1c2d1a',h:'#4a6b3a',t:'#26391f',e:'#e8f0c0',g:'#4d7a30',l:'#5f9340',s:'#2f4f26'};

/* --- regras de onde o sapo pode estar: só na lama/água do PRÓPRIO lago, nunca em rio --- */
const cellOf=(x,y)=>Math.min(N-1,Math.max(0,Math.floor(y/G)))*N+Math.min(N-1,Math.max(0,Math.floor(x/G)));
function okFrog(x,y,L){
  const t=terr(x,y);
  if(t===WATER)return LID[cellOf(x,y)]===L.id;
  if(t!==MUD)return false;
  const ci=Math.floor(x/G),cj=Math.floor(y/G);
  for(let b=-4;b<=4;b++)for(let a=-4;a<=4;a++){const X=ci+a,Y=cj+b;if(X>=0&&Y>=0&&X<N&&Y<N&&LID[Y*N+X]===L.id)return true}
  return false;
}
function exitPoint(L,x0,y0,nA){            // ponto de lama mais próximo saindo da água
  let best=null,bd=1e9;
  for(let k=0;k<nA;k++){
    const a=nA===1?Math.random()*6.283:k/nA*6.283,dx=Math.cos(a),dy=Math.sin(a);let x=x0,y=y0,n=0;
    while(n++<90&&terr(x,y)===WATER){x+=dx*2;y+=dy*2}
    if(terr(x,y)!==WATER){x+=dx*3;y+=dy*3;if(terr(x,y)===MUD&&okFrog(x,y,L)){const d=n;if(d<bd){bd=d;best={x,y}}}}
  }
  return best;
}
function shorePoint(L){for(let k=0;k<40;k++){const c=L.cells[(Math.random()*L.cells.length)|0],e=exitPoint(L,(c%N+.5)*G,((c/N)|0)*G+G/2,1);if(e)return e}return null}
function newFrog(L,x,y,sex,young){return{L,x,y,sex,young,age:0,dir:'down',t:Math.random()*9,mode:'wander',wait:Math.random()*2,tx:null,ty:null,landAct:'walk',hp:0,z:0,dist:0,mv:false,inW:false,lim:0,n:0}}
function initFrogs(){
  for(const L of lakeList){
    L.frogs=[];L.tads=[];L.bt=BREED;
    const a=shorePoint(L),b=shorePoint(L);
    if(a)L.frogs.push(newFrog(L,a.x,a.y,'m',false));
    if(b)L.frogs.push(newFrog(L,b.x,b.y,'f',false));
  }
}
function layTads(L,F,n){
  const room=MAXPOP-L.frogs.length-L.tads.length;n=Math.min(n,room);
  let bx=F.x,by=F.y;if(terr(bx,by)!==WATER){const c=L.water[(Math.random()*L.water.length)|0];bx=(c%N+.5)*G;by=(((c/N)|0)+.5)*G}
  for(let i=0;i<n;i++){
    let x=bx,y=by;
    for(let k=0;k<20;k++){const a=Math.random()*6.283,r=5+Math.random()*9,X=bx+Math.cos(a)*r,Y=by+Math.sin(a)*r;if(terr(X,Y)===WATER&&LID[cellOf(X,Y)]===L.id){x=X;y=Y;break}}
    L.tads.push({x,y,age:0,dir:Math.random()<.5?0:1});rings.push({x,y,t:0});
  }
}
function breed(L){
  const fem=L.frogs.find(f=>f.sex==='f'&&!f.young&&f.mode==='wander'),male=L.frogs.some(f=>f.sex==='m'&&!f.young);
  const room=MAXPOP-L.frogs.length-L.tads.length;
  if(!fem||!male||room<=0||!L.water.length)return;
  const n=Math.min(room,1+((Math.random()*3)|0));
  if(Math.hypot(fem.x-p.x,fem.y-p.y)<450){
    let bd=1e9,bc=-1;for(let i=0;i<L.water.length;i+=3){const c=L.water[i],d=Math.hypot((c%N+.5)*G-fem.x,(((c/N)|0)+.5)*G-fem.y);if(d<bd){bd=d;bc=c}}
    fem.mode='toLay';fem.n=n;fem.tx=(bc%N+.5)*G;fem.ty=(((bc/N)|0)+.5)*G;fem.wait=0;fem.lim=45;

function emerge(L,i){

  L.tads.splice(i,1);L.frogs.push(newFrog(L,pt.x,pt.y,Math.random()<.5?'m':'f',true));splash(d.x,d.y,6,.5);

function pickTarget(F,L){
  if(F.mode==='out'){const e=exitPoint(L,F.x,F.y,16);if(e){F.tx=e.x;F.ty=e.y}else F.mode='wander';return}
  F.landAct=Math.random()<.5?'hop':'walk';F.hp=0;
  for(let k=0;k<10;k++){
    const a=Math.random()*6.283,r=12+Math.random()*30,x=F.x+Math.cos(a)*r,y=F.y+Math.sin(a)*r;
    if(okFrog(x,y,L)){F.tx=x;F.ty=y;return}
  }

function moveFrog(F,L,dt){
  F.t+=dt;F.inW=terr(F.x,F.y)===WATER;
  if(F.lim>0){F.lim-=dt;if(F.lim<=0){F.mode=F.inW?'out':'wander';F.tx=null;F.wait=0}}
  if(F.wait>0){F.wait-=dt;F.mv=false;F.z=0;
    if(F.inW&&F.mode==='laying'&&Math.random()<dt*1.2)rings.push({x:F.x,y:F.y,t:0});
    if(F.wait<=0&&F.mode==='laying'){layTads(L,F,F.n);F.mode='out';F.lim=40}
    return}
  if(F.tx==null){pickTarget(F,L);return}
  const dx=F.tx-F.x,dy=F.ty-F.y,d=Math.hypot(dx,dy);
  if(d<2.5){F.tx=null;F.z=0;F.mv=false;
    if(F.mode==='toLay'){F.mode='laying';F.wait=2.6}
    else if(F.mode==='out'){F.mode='wander';F.lim=0;F.wait=1+Math.random()*3}

  else{v=WALKV;F.z=0}
  F.dir=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up');
  if(v>0){
    const nx=F.x+dx/d*v*dt,ny=F.y+dy/d*v*dt;
    if(okFrog(nx,ny,L)){F.x=nx;F.y=ny;F.dist+=v*dt;F.mv=true}else{F.tx=null;F.wait=.5+Math.random();F.z=0;F.mv=false}
  }else F.mv=false;
}
function updateFrogs(dt){
  for(const L of lakeList){
    if(!L.frogs)continue;
    L.bt-=dt;if(L.bt<=0){L.bt=BREED;breed(L)}
    for(let i=L.tads.length-1;i>=0;i--){const d=L.tads[i];d.age+=dt;if(d.age>=TAD_T[2])emerge(L,i)}
    for(const F of L.frogs){
      if(F.young){F.age+=dt;if(F.age>=YOUNG_T)F.young=false}
      if(Math.hypot(F.x-p.x,F.y-p.y)<500)moveFrog(F,L,dt);
    }
  }
}
function drawTads(camX,camY){
  for(const L of lakeList){if(!L.tads)continue;
    for(const d of L.tads){
      const sx=Math.round(d.x-camX),sy=Math.round(d.y-camY);if(sx<-14||sy<-14||sx>W+14||sy>H+14)continue;

}
function drawFrog(F,camX,camY){
  const sx=Math.round(F.x-camX),sy=Math.round(F.y-camY);
  let an,f;
  if(F.inW){an='swim';f=F.mv?Math.floor(F.t*5)%4:Math.floor(F.t*1.3)%2}
  else if(F.landAct==='hop'&&F.tx!=null&&F.wait<=0){an='hop';f=F.hp<.14?0:F.hp<.48?1:2}
  else if(F.mv){an='walk';f=Math.floor(F.dist/2.6)%4}

  const s=frogSpr(F.sex,F.dir,an,f,F.young),w=s.width,h=s.height,x0=sx-(w>>1);
  if(!F.inW){const z=Math.round(F.z);ell(sx,sy-1,(w>>2)+1-(z>3?1:0),2,'rgba(0,25,0,.28)');g.drawImage(s,x0,sy-h+1-z)}
  else{const vis=h-5,dy0=sy-h+4;g.drawImage(s,0,0,w,vis,x0,dy0,w,vis);g.globalAlpha=.3;g.drawImage(s,0,vis,w,h-vis,x0,dy0+vis,w,h-vis);g.globalAlpha=1;
    g.fillStyle='rgba(212,239,255,.9)';g.fillRect(sx-(w>>2),dy0+vis,w>>1,1)}
}

const LEAF=6,acuris=[],TAREAS=[],SAREAS=[],fruits=[],drops=[],carc=[],beetles=[],herds=[],jags=[];
DA=new Uint8Array(N*N);
const TUNE={SEED_T:90,YOUNG_T:180,POL_MIN:360,POL_VAR:180,HANG:120,DIGEST:25,JAG_P:.67}; // segundos
function dirtAreas(){
  const NN=N*N,lab=new Int32Array(NN),areas=[];
  const isD=c=>DN[c]>.62&&terr((c%N)*G+4,((c/N)|0)*G+4)===DIRT;
  for(let c=0;c<NN;c++){
    if(lab[c]||!isD(c))continue;
    const id=areas.length+1,comp=[c];lab[c]=id;
    for(let k=0;k<comp.length;k++){const q=comp[k],qi=q%N,qj=(q/N)|0;
      for(const [a,b] of [[1,0],[-1,0],[0,1],[0,-1]]){const x=qi+a,y=qj+b;if(x<1||y<1||x>=N-1||y>=N-1)continue;const n=y*N+x;if(!lab[n]&&isD(n)){lab[n]=id;comp.push(n)}}}
    if(comp.length>=14)areas.push(comp);else for(const q of comp)lab[q]=-1;
  }
  /* 30% das áreas de terra têm folhas secas; 2/3 delas com Acuris, 1/3 vazias (zonas de plantio) */
  const ord=areas.map((_,i)=>i).sort((a,b)=>hs(a,7,SEED+90)-hs(b,7,SEED+90)),nL=Math.max(3,Math.round(areas.length*.3)),nT=Math.round(nL*.65);
  const lit=ord.slice(0,nL),mark=[];
  for(const i of lit)for(const c of areas[i])mark.push(c);
  for(const c of mark)DA[c]=1;
  {const add=[];for(const c of mark){const ci=c%N,cj=(c/N)|0;for(let b=-1;b<=1;b++)for(let a=-1;a<=1;a++){const n=(cj+b)*N+ci+a;if(!DA[n])add.push(n)}}for(const n of add)DA[n]=1}
  lit.forEach((i,li)=>{
    const comp=areas[i],A=comp.length;let sx=0,sy=0;for(const c of comp){sx+=c%N;sy+=(c/N)|0}
    const ar={cx:(sx/A+.5)*G,cy:(sy/A+.5)*G,A,cells:comp,trees:0,r:Math.sqrt(A*64/3.14)};
    if(li>=nT){ar.cap=Math.max(3,Math.floor(A/25));SAREAS.push(ar);return}
    const want=A<80?3:Math.min(20,5+Math.floor((A-80)/80));ar.cap=want+2;TAREAS.push(ar);
    const cand=comp.slice().sort((a,b)=>hs(a,3,SEED+91)-hs(b,3,SEED+91)),placed=[];
    for(let sp=30;sp>=18&&placed.length<want;sp-=6)for(const c of cand){if(placed.length>=want)break;
      const x=(c%N)*G+G/2+(hs(c,4,SEED+92)-.5)*6,y=((c/N)|0)*G+G/2+(hs(c,5,SEED+92)-.5)*6;
      if(placed.some(t=>Math.hypot(t.x-x,t.y-y)<sp))continue;
      if([[0,0],[9,0],[-9,0],[0,6],[0,-9]].every(([a,b])=>terr(x+a,y+b)===LEAF))placed.push({x,y})}
    for(const t of placed)acuris.push({k:12,x:t.x,y:t.y,st:2,age:0,pol:false,ft:0,hang:0,ar});
    ar.trees=placed.length;
  });

  else if(t.st===2&&t.pol){t.ft-=dt;if(t.ft<=0){t.st=3;t.hang=TUNE.HANG}}
  else if(t.st===3){t.hang-=dt;if(t.hang<=0){t.st=2;t.pol=false;const n=3+((Math.random()*2)|0);for(let i=0;i<n;i++){const[x,y]=walkPt(t.x,t.y,16);fruits.push({x,y,age:0})}}}
}}
function moveF(a,tx,ty,v,dt){const dx=tx-a.x,dy=ty-a.y,d=Math.hypot(dx,dy);if(d<1.5){a.mv=false;return d}const s=Math.min(v*dt,d);a.x=Math.max(RIM,Math.min(WS-RIM,a.x+dx/d*s));a.y=Math.max(RIM,Math.min(WS-RIM,a.y+dy/d*s));a.dist+=s;a.mv=true;a.dir=dir8(dx,dy);return d}
function updBeetle(b,dt){   // voa procurando Acuris adultas ainda sem fruto
  b.t+=dt;
  if(!near(b,520)){b.far-=dt;if(b.far<=0){b.far=30+Math.random()*30;const t=nearestTree(b,300,t=>t.st===2&&!t.pol);if(t){pollinate(t);b.x=t.x+8;b.y=t.y+2}}return}
  b.z+=((b.pol?40:12)-b.z)*Math.min(1,dt*4);
  if(b.pol){b.pt-=dt;b.mv=false;if(b.pt<=0){pollinate(b.pol);b.pol=null;b.wait=1}return}
  if(b.wait>0){b.wait-=dt;b.mv=false;return}
  if(b.tx==null){const t=nearestTree(b,700,t=>t.st===2&&!t.pol&&!(t.cl>GT&&t.cb!==b));
    if(t){b.tr=t;t.cl=GT+25;t.cb=b;b.tx=t.x;b.ty=t.y+1}else{const a=Math.random()*6.283,r=30+Math.random()*90;b.tx=b.x+Math.cos(a)*r;b.ty=b.y+Math.sin(a)*r;b.tr=null}}
  const d=moveF(b,b.tx,b.ty,30,dt);
  if(d<3){if(b.tr&&b.tr.st===2&&!b.tr.pol){b.pol=b.tr;b.pt=3.5}else b.wait=.3+Math.random()*1.2;b.tx=null;b.tr=null}
}
function plantSeed(ar,x,y){drops.push({x,y,t:12});if(ar.trees>=ar.cap||acuris.some(t=>Math.hypot(t.x-x,t.y-y)<18))return;acuris.push({k:12,x,y,st:0,age:0,pol:false,ft:0,hang:0,ar});ar.trees++}
function mkPec(x,y){return{x,y,dir:'d',t:Math.random()*9,mv:false,run:false,act:'walk',ox:(Math.random()-.5)*34,oy:(Math.random()-.5)*26,dist:0,full:false,eat:0,tm:0,px:0,py:0,f:null}}
function mkHerd(ar){const h={ar,m:[],mode:'loiter',wt:0,tx:ar.cx,ty:ar.cy,cd:0,rt:150,dg:0,sa:null,ft:0};for(let i=0;i<5;i++){const[x,y]=walkPt(ar.cx,ar.cy,30);h.m.push(mkPec(x,y))}return h}
function mkJag(ar){const c=ar.cells[(Math.random()*ar.cells.length)|0],j={x:(c%N+.5)*G,y:((c/N)|0)*G+4,dir:'d',t:0,mv:false,run:false,mode:'prowl',ar,wait:2,tx:null,ty:0,tg:null,h:null,cd:20,dist:0,t2:0,z:0,fade:1,car:null,dc:15+Math.random()*40,stk:0,wx:0,wy:0,fx:'r',sta:1,al:0,alert:false,shy:0,spot:0};return j}
function updHerd(h,dt){
  const L=h.m[0];if(!L)return;
  h.rt-=dt;if(h.m.length<5&&h.rt<=0){h.rt=150;h.m.push(mkPec(L.x+8,L.y+8))}
  h.cd-=dt;
  const follow=(m,tx,ty,run)=>{m.run=run;m.act='walk';const sp=run?38:15,d=moveA(m,tx+m.ox,ty+m.oy,sp*(m===L?1:1.12),dt);if(d<2)m.mv=false};
  if(h.mode==='loiter'||h.mode==='digest'){
    h.wt-=dt;if(h.wt<=0){const[x,y]=walkPt(h.ar.cx,h.ar.cy,Math.min(90,h.ar.r+30));h.tx=x;h.ty=y;h.wt=5+Math.random()*7}
    for(const m of h.m){if(Math.hypot(m.x-h.tx,m.y-h.ty)>30)follow(m,h.tx,h.ty,false);else{m.mv=false;m.act='walk'}}
    if(h.mode==='digest'){h.dg-=dt;if(h.dg<=0){let s=null,bd=1e9;for(const a of SAREAS){const d=Math.hypot(a.cx-L.x,a.cy-L.y);if(d<bd&&a.trees<a.cap){bd=d;s=a}}h.sa=s;h.mode=s?'toSeed':'loiter'}}
    else if(h.cd<=0){let any=false;for(const f of fruits)if(Math.hypot(f.x-h.ar.cx,f.y-h.ar.cy)<h.ar.r+160){any=true;break}if(any){h.mode='eat';for(const m of h.m)m.f=null}}
  }else if(h.mode==='eat'){
    let busy=false;
    for(const m of h.m){
      if(m.eat>0){m.eat-=dt;m.act='eat';m.mv=false;busy=true;if(m.eat<=0){m.full=true;m.f=null}continue}
      if(!m.f||!fruits.includes(m.f)){m.f=null;let bd=1e9;for(const f of fruits){if(f.cl&&f.cl!==m&&fruits.length>h.m.length)continue;const d=Math.hypot(f.x-m.x,f.y-m.y);if(d<bd&&Math.hypot(f.x-h.ar.cx,f.y-h.ar.cy)<h.ar.r+200){bd=d;m.f=f}}if(m.f)m.f.cl=m}
      if(m.f){busy=true;m.run=true;m.act='walk';const d=moveA(m,m.f.x,m.f.y,38,dt);if(d<3){fruits.splice(fruits.indexOf(m.f),1);m.f=null;m.eat=3.5}}else follow(m,L.x,L.y,false);
    }
    if(!busy){h.mode='digest';h.dg=TUNE.DIGEST;h.cd=60;for(const m of h.m)m.act='walk'}
  }else if(h.mode==='toSeed'){
    const a=h.sa;for(const m of h.m)follow(m,a.cx,a.cy,false);
    if(terr(L.x,L.y)===LEAF&&Math.hypot(L.x-a.cx,L.y-a.cy)<a.r){h.mode='poop';for(const m of h.m){const c=a.cells[(Math.random()*a.cells.length)|0];m.px=(c%N+.5)*G;m.py=((c/N)|0)*G+4;m.tm=0;m.pd=false}}
  }else if(h.mode==='poop'){
    let busy=false;
    for(const m of h.m){
      if(m.pd){follow(m,h.sa.cx,h.sa.cy,false);continue}
      busy=true;
      if(m.tm>0){m.tm-=dt;m.act='poop';m.mv=false;if(m.tm<=0){m.pd=true;if(m.full)plantSeed(h.sa,m.x,m.y+3);m.full=false;m.act='walk'}}
      else{m.act='walk';m.run=false;const d=moveA(m,m.px,m.py,15,dt);if(d<3)m.tm=2.6}
    }
    if(!busy){h.mode='back';h.ft=0}
  }else if(h.mode==='back'||h.mode==='flee'){
    h.ft+=dt;for(const m of h.m)follow(m,h.ar.cx,h.ar.cy,h.mode==='flee');
    if(Math.hypot(L.x-h.ar.cx,L.y-h.ar.cy)<50||h.ft>(h.mode==='flee'?6:90)){h.mode=h.mode==='flee'?'back':'loiter';h.ft=0;h.cd=60}
  }
}
function riverSpot(x,y){   // margem de RIO (correnteza) mais próxima; lagos não contam
  let best=null,bd=1e9;
  for(let k=0;k<16;k++){const a=k/16*6.283,dx=Math.cos(a),dy=Math.sin(a);let px=x,py=y;
    for(let d=6;d<=320;d+=6){const nx=x+dx*d,ny=y+dy*d;
      if(!okW(nx,ny)){if(terr(nx,ny)===WATER&&LID[cellOf(nx,ny)]===0&&d<bd&&okW(px,py)){bd=d;best={x:px,y:py,wx:nx,wy:ny}}break}
      px=nx;py=ny}}
  return best}
function tryHunt(j){if(j.cd>0||j.sta<.6)return false;for(const h of herds)if(h.sa===j.ar&&(h.mode==='toSeed'||h.mode==='poop')&&h.m.length){j.h=h;j.tg=h.m[(Math.random()*h.m.length)|0];j.mode='stalk';j.spot=0;return true}return false}
function updJag(j,dt){
  j.t+=dt;const A=j.ar;j.cd-=dt;j.dc-=dt;
  if(j.mode==='dead'){j.fade-=dt/8;return}
  if(/r/.test(j.dir))j.fx='r';else if(/l/.test(j.dir))j.fx='l';
  if(j.run&&j.mv)j.sta=Math.max(0,j.sta-dt*.11);else j.sta=Math.min(1,j.sta+dt*(j.mode==='rest'?.15:.04)); // fôlego
  j.alert=false;
  if(j.mode==='shy'){   // foge do jogador
    j.shy-=dt;j.run=true;const dx=j.x-p.x,dy=j.y-p.y,l=Math.hypot(dx,dy)||1;
    moveA(j,j.x+dx/l*60,j.y+dy/l*60,42,dt);if(!j.mv)moveA(j,j.x-dy/l*60,j.y+dx/l*60,42,dt);
    if(j.shy<=0||l>170){j.mode='prowl';j.run=false;j.mv=false;j.wait=2+Math.random()*3;j.tx=null;j.al=0;j.dc=Math.max(j.dc,20)}
    return}
  if(j.mode==='prowl'||j.mode==='rest'||j.mode==='drink'){   // percebe o jogador: encara; se chegar perto, foge
    const pd=Math.hypot(p.x-j.x,p.y-j.y);
    if(pd<110){j.al+=dt;j.dir=dir8(p.x-j.x,p.y-j.y);
      if(pd<48||j.al>6){j.mode='shy';j.shy=4;j.tx=null;return}
      j.alert=true;j.mv=false;j.run=false;return}
    if(pd>130)j.al=0;
  }
  if(j.mode==='eat'){j.mv=false;j.t2-=dt;if(j.t2<=0){j.car.st=1;j.car.t=45;j.mode='rest';j.t2=7;j.cd=150;j.tx=null}return}
  if(j.mode==='rest'){j.mv=false;j.t2-=dt;if(tryHunt(j))return;if(j.t2<=0){j.mode='prowl';j.wait=1;j.tx=null}return}
  if(j.mode==='drink'){j.mv=false;j.t2-=dt;if(Math.random()<dt*1.5)rings.push({x:j.wx,y:j.wy,t:0});if(tryHunt(j))return;if(j.t2<=0){j.mode='rest';j.t2=8;j.dc=100+Math.random()*80}return}
  if(j.mode==='toDrink'){j.run=false;const d=moveA(j,j.tx,j.ty,18,dt);
    if(!j.mv&&d>3){j.stk+=dt;if(j.stk>1.2){j.mode='prowl';j.tx=null;j.dc=40;j.stk=0;return}}else j.stk=0;
    if(d<3){j.mode='drink';j.t2=6.5;j.dir=dir8(j.wx-j.x,j.wy-j.y)}else tryHunt(j);return}
  if(j.mode==='prowl'){
    j.run=false;
    if(j.wait>0){j.wait-=dt;j.mv=false;
      if(j.wait<=0){const r=Math.random();
        if(j.dc<=0&&r<.4){const s=riverSpot(j.x,j.y);if(s){j.tx=s.x;j.ty=s.y;j.wx=s.wx;j.wy=s.wy;j.mode='toDrink';j.stk=0;return}j.dc=30}
        else if(r<.2){j.mode='rest';j.t2=6+Math.random()*6;return}}}
    else{if(j.tx==null)[j.tx,j.ty]=walkPt(A.cx,A.cy,A.r+40);const d=moveA(j,j.tx,j.ty,14,dt);
      if(!j.mv&&d>3){j.stk+=dt;if(j.stk>1){j.tx=null;j.stk=0}}else j.stk=0;
      if(d<3){j.tx=null;j.wait=2+Math.random()*5}}
    tryHunt(j);
  }else if(j.mode==='stalk'){
    const T=j.tg;if(!T||!j.h.m.includes(T)){j.mode='prowl';j.tx=null;return}
    const d=Math.hypot(T.x-j.x,T.y-j.y),hd=j.h;j.run=d<90&&j.sta>.12;moveA(j,T.x,T.y,j.run?52:20,dt);
    if(d<75&&!j.spot&&hd.mode!=='flee'&&Math.random()<dt*(j.run?.55:.12)){j.spot=1;hd.mode='flee';hd.ft=0}   // a manada pode farejar a onça
    if(j.sta<=.05||(j.spot&&d>150)){j.mode='rest';j.t2=9;j.cd=110+Math.random()*60;j.tg=null;j.run=false;j.mv=false;return}   // cansou / presa escapou
    if(d<30){j.mode='pounce';j.t2=0;j.px=T.x;j.py=T.y}
  }else if(j.mode==='pounce'){
    const T=j.tg;if(!T||!j.h.m.includes(T)){j.mode='prowl';j.tx=null;j.z=0;return}
    j.t2+=dt;j.run=true;j.z=9*Math.sin(Math.PI*Math.min(1,j.t2/.6));moveA(j,T.x,T.y,70,dt);
    if(j.t2>=.6){j.z=0;j.mode='attack';j.t2=0;j.kd=0;j.win=Math.random()<(j.spot?TUNE.JAG_P-.07:TUNE.JAG_P+.18);
      if(!j.win)for(const m of j.h.m){m.act='walk';m.fight=true}}
  }else if(j.mode==='attack'){
    if(!j.tg||!j.h){j.mode='prowl';j.tx=null;return}
    j.t2+=dt;j.mv=false;j.run=false;j.dir=dir8(j.tg.x-j.x,j.tg.y-j.y);
    if(j.win){
      if(!j.kd&&j.t2>.55){j.kd=1;const hd=j.h,T=j.tg;hd.m.splice(hd.m.indexOf(T),1);const c={x:T.x,y:T.y,st:0,t:0,dir:T.dir};carc.push(c);j.car=c;hd.mode='flee';hd.ft=0}
      if(j.t2>1.4){j.kd=0;if(!j.car){j.mode='prowl';j.tx=null;return}j.mode='eat';j.t2=14;j.dir=dir8(j.car.x-j.x,j.car.y-j.y)}
    }else{
      for(const m of j.h.m){m.run=true;m.act='fight';moveA(m,j.x,j.y,40,dt);m.dir=dir8(j.x-m.x,j.y-m.y)}
      if(j.t2>2.6){j.mode='dead';j.fade=1;j.mv=false;A.rj=240;for(const m of j.h.m){m.fight=false;m.act='walk'}j.h.mode='poop'}
    }
  }
}
function initLife(){
  for(const ar of TAREAS){herds.push(mkHerd(ar));for(let i=0;i<2;i++){const[x,y]=walkPt(ar.cx,ar.cy,40);const b={x,y,z:12,dir:'d',t:Math.random()*9,mv:false,dist:0,tx:null,ty:0,wait:Math.random()*3,pol:null,pt:0,far:20+Math.random()*30};beetles.push(b)}}
  for(const ar of SAREAS){ar.rj=0;jags.push(mkJag(ar))}
}
function updateLife(dt){
  GT+=dt;updTrees(dt);
  for(const b of beetles)updBeetle(b,dt);
  for(const h of herds)if(near({x:h.m[0]?h.m[0].x:h.ar.cx,y:h.m[0]?h.m[0].y:h.ar.cy},520))updHerd(h,dt);
  for(let i=jags.length-1;i>=0;i--){const j=jags[i];if(near(j,520)||j.mode!=='prowl')updJag(j,dt);
    if(j.mode==='dead'&&j.fade<=0){jags.splice(i,1)}}
  for(const ar of SAREAS)if(ar.rj>0){ar.rj-=dt;if(ar.rj<=0&&!jags.some(j=>j.ar===ar))jags.push(mkJag(ar))}
  for(let i=fruits.length-1;i>=0;i--){const fr=fruits[i];fr.age+=dt;if(fr.age>300)fruits.splice(i,1)}
  for(const d of drops)d.t-=dt;for(let i=drops.length-1;i>=0;i--)if(drops[i].t<=0)drops.splice(i,1);
  for(let i=carc.length-1;i>=0;i--){const c=carc[i];if(c.st===1){c.t-=dt;if(c.t<=0)carc.splice(i,1)}else c.t+=dt}
}
function pushLife(objs,camX,camY){
  const v=(x,y)=>x>camX-50&&x<camX+W+50&&y>camY-20&&y<camY+H+100;
  for(const f of fruits)if(v(f.x,f.y))objs.push({k:17,x:f.x,y:f.y-1,o:f});
  for(const d of drops)if(v(d.x,d.y))objs.push({k:18,x:d.x,y:d.y-1,o:d});
  for(const c of carc)if(v(c.x,c.y))objs.push({k:16,x:c.x,y:c.y-1,o:c});
  for(const b of beetles)if(v(b.x,b.y-b.z))objs.push({k:15,x:b.x,y:b.y+(b.pol?30:0),o:b});
  for(const h of herds)for(const m of h.m)if(v(m.x,m.y))objs.push({k:13,x:m.x,y:m.y,o:m});
  for(const j of jags)if(v(j.x,j.y))objs.push({k:14,x:j.x,y:j.y,o:j});
}
function drawLife(o,sx,sy){
  const a=o.o;
  if(o.k===12){const t=o;ell(sx,sy-1,t.st?10:4,3,'rgba(0,25,0,.28)');
    if(t.st===0)g.drawImage(SEEDL,sx-10,sy-21);else if(t.st===1){if(IMG0.complete)g.drawImage(IMG0,sx-18,sy-46,36,46)}
    else{const im=t.st===3?IMG1:IMG0;if(im.complete)g.drawImage(im,sx-36,sy-92)}}
  else if(o.k===17){g.globalAlpha=a.age>240?Math.max(.35,1-(a.age-240)/80):1;g.drawImage(FRUIT,sx-7,sy-6);g.globalAlpha=1}
  else if(o.k===18){g.globalAlpha=Math.min(1,a.t/3);g.drawImage(DROP,sx-5,sy-3);g.globalAlpha=1}
  else if(o.k===16){if(a.st===0){ell(sx,sy-1,12,3,'rgba(0,25,0,.3)');drawAt('pec','dead',a.dir,Math.min(3,Math.floor(a.t/.3)),sx,sy,0)}else g.drawImage(CAR[1],sx-13,sy-9)}
  else if(o.k===15){const z=a.z+Math.sin(a.t*3)*1.5;ell(sx,sy-1,5,2,'rgba(0,25,0,.25)');drawAt('bt','fly',a.dir,Math.floor(a.t*16)%8,sx,sy,z);
    if(a.pol){g.fillStyle='#f6dc4a';for(let i=0;i<4;i++)g.fillRect(sx-5+Math.round(Math.sin(a.t*5+i*2)*6),sy-a.z-4+((a.t*14+i*5)%9|0),1,1)}}
  else if(o.k===13){let an='walk',f=0,zz=0;
    if(a.act==='poop'){an='poop';f=Math.floor(a.t*2.5)%4}else if(a.act==='eat'){f=0;zz=-(Math.floor(a.t*3)%2)}
    else if(a.run&&a.mv){an='run';f=Math.floor(a.dist/4)%5}else if(a.mv)f=Math.floor(a.dist/3)%5;
    ell(sx,sy-1,12,3,'rgba(0,25,0,.3)');drawAt('pec',an,a.dir,f,sx,sy,zz)}
  else if(o.k===14)drawJag(a,sx,sy)
}
function loading(){g.fillStyle='#0d2410';g.fillRect(0,0,W,H);g.fillStyle='#e8f5d8';g.font='10px sans-serif';g.textAlign='center';g.fillText('Gerando a floresta e os rios…',W/2,H/2);g.textAlign='left'}

function step(dt,ts){
  p.t+=dt;updateFrogs(dt);updateLife(dt);
  const px=Math.round(p.x),py=Math.round(p.y);
  const inW=terr(px,py)===WATER,dep=inW?wdep(p.x,p.y):0;
  if(!p.swim&&inW&&p.z===0&&dep>=.55)p.swim=true;
  else if(p.swim&&(!inW||dep<.4))p.swim=false;
  if(inW&&!p.wasW&&p.z===0)splash(p.x,p.y,6,.6);
  p.wasW=inW;
  if(keys.jump&&!jumpHeld&&p.z===0&&!p.swim&&p.land<=0){p.vz=JUMP_V;p.z=.01}
  jumpHeld=keys.jump;
  if(p.z>0){p.vz-=GRAV*dt;p.z+=p.vz*dt;if(p.z<=0){p.z=0;p.vz=0;p.land=.16;if(terr(Math.round(p.x),Math.round(p.y))===WATER)splash(p.x,p.y,18,1)}}
  if(p.land>0)p.land-=dt;
  const running=keys.run&&!inW;
  const spd=SPEED*(p.swim?SWIM_SPEED:inW&&p.z===0?WATER_SLOW:running?RUN_MUL:1);
  const dx=keys.right-keys.left,dy=keys.down-keys.up;
  p.moving=!!(dx||dy);
  if(p.moving){
    const n=Math.hypot(dx,dy);p.x+=dx/n*spd*dt;p.y+=dy/n*spd*dt;p.dist+=spd*dt;
    if(dx&&dy)p.face=(lastAxis==='h')?(dx>0?'right':'left'):(dy>0?'down':'up');
    else p.face=dx?(dx>0?'right':'left'):(dy>0?'down':'up');
  }else p.dist=0;
  if(inW&&p.z===0){const k=p.swim?.85:.45;p.x+=bl(FX,p.x,p.y)*k*dt;p.y+=bl(FY,p.x,p.y)*k*dt}   // correnteza arrasta
  p.x=Math.min(WS-RIM,Math.max(RIM,p.x));p.y=Math.min(WS-RIM,Math.max(RIM,p.y));

  const wade=inW&&!p.swim&&p.z===0;
  p.sub+=((wade?Math.min(1,.35+dep*1.1):0)-p.sub)*Math.min(1,dt*12);
  const sub=Math.round(p.sub*5);
  if(inW&&p.z===0){
    if(p.moving){ringAcc+=spd*dt;if(ringAcc>5){ringAcc=0;rings.push({x:p.x,y:p.y,t:0})}}
    else{idleT+=dt;if(idleT>.9){idleT=0;rings.push({x:p.x,y:p.y,t:0})}}
  }else{ringAcc=0;idleT=0}
  for(let i=rings.length-1;i>=0;i--){rings[i].t+=dt;if(rings[i].t>.8)rings.splice(i,1)}
  for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.t+=dt;q.vz-=GRAV*dt;q.z+=q.vz*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;if(q.z<=0||q.t>1.2)parts.splice(i,1)}
  fishT-=dt;if(fishT<=0){fishT=1.8+Math.random()*4;spawnFish(Math.round(p.x-W/2),Math.round(p.y-H/2))}
  for(let i=fish.length-1;i>=0;i--){const f=fish[i];f.t+=dt;if(f.t>=f.dur){splash(f.x+f.dir*18,f.y,6,.55);fish.splice(i,1)}}

  const camX=Math.round(p.x-W/2),camY=Math.round(p.y-H/2),t=ts;
  drawGround(camX,camY);
  for(let ly=Math.floor(camY/22)-1;ly<=Math.floor((camY+H)/22)+1;ly++)for(let lx=Math.floor(camX/22)-1;lx<=Math.floor((camX+W)/22)+1;lx++){
    const v=padAt(lx,ly);if(!v)continue;const s=PADS[v.s];
    g.drawImage(s,Math.round(v.x-camX-s.width/2),Math.round(v.y-camY-s.height/2+Math.sin(t*1.4+v.ph)*.6));
  }
  drawWaterFx(camX,camY,t);
  for(const r of rings)if(r.t>=0)ring(r.x-camX,r.y-camY,2+r.t*16,1-r.t/.8);
  for(const s of springs){const sx=s.x-camX,sy=s.y-camY;if(sx<-20||sy<-20||sx>W+20||sy>H+20)continue;
    for(let k=0;k<3;k++){const u=(t*.7+k/3)%1;ring(sx,sy,1+u*8,(1-u)*.8)}}
  drawTads(camX,camY);
  const x0=Math.floor(camX/T),y0=Math.floor(camY/T),objs=[];
  for(let ty=y0-2;ty<=y0+H/T+3;ty++)for(let tx=x0-2;tx<=x0+W/T+3;tx++){
    const v=tileObj(tx,ty);if(v)objs.push(v);
  }
  for(const r of springRocks)if(r.x>camX-20&&r.x<camX+W+20&&r.y>camY-20&&r.y<camY+H+20)objs.push({k:1,x:r.x,y:r.y});
  for(const L of lakeList)if(L.frogs)for(const F of L.frogs)if(F.x>camX-20&&F.x<camX+W+20&&F.y>camY-10&&F.y<camY+H+30)objs.push({k:10,x:F.x,y:F.y,F});
  for(const t of acuris)if(t.x>camX-40&&t.x<camX+W+40&&t.y>camY-8&&t.y<camY+H+80)objs.push(t);
  pushLife(objs,camX,camY);
  objs.sort((a,b)=>a.y-b.y);
  const fx=W/2,fy=H/2;
  const drawObj=o=>{const sx=Math.round(o.x-camX),sy=Math.round(o.y-camY);
    if(o.k===0)g.drawImage(tree,sx-22,sy-46);
    else if(o.k===1)rock(sx,sy);else if(o.k===2)bush(sx,sy);else if(o.k===10)drawFrog(o.F,camX,camY);else if(o.k>=12)drawLife(o,sx,sy);
    else{const s=PL[o.t],half=s.height>>1,sw=Math.round(Math.sin(t*1.5+o.ph)),dx0=sx-(s.width>>1),dy0=sy-s.height;
      g.drawImage(s,0,half,s.width,s.height-half,dx0,dy0+half,s.width,s.height-half);g.drawImage(s,0,0,s.width,half,dx0+sw,dy0,s.width,half)}};
  let i=0;
  while(i<objs.length&&objs[i].y-camY<=fy)drawObj(objs[i++]);
  if(!inW&&!p.swim){const k=Math.min(3,Math.round(p.z/5));ell(fx,fy-1,8-k,3-(k>2?1:0),'rgba(0,25,0,.22)');ell(fx,fy-1,5-k,2,'rgba(0,25,0,.30)')}
  if(sheetOk){
    let a=0,f;
    if(p.swim){a=3;f=Math.floor(p.t*(p.moving?9:4))%8}
    else if(p.z>0){a=2;f=p.vz>85?1:p.vz>25?2:p.vz>-25?3:4}
    else if(p.land>0){a=2;f=5}
    else if(p.moving&&running){a=1;f=Math.floor(p.dist/STRIDE_RUN)%NF}
    else{a=0;f=p.moving?Math.floor(p.dist/STRIDE)%NF:8}
    const sxs=f*FW,sys=(a*4+ROW[p.face])*FH,dx0=fx-FW/2,dy0=fy-FEET_ROW-1-Math.round(p.z);
    if(sub>0){
      const vis=FEET_ROW+1-sub;
      g.drawImage(sheet,sxs,sys,FW,vis,dx0,dy0,FW,vis);
      g.globalAlpha=.3;g.drawImage(sheet,sxs,sys+vis,FW,FH-vis,dx0,dy0+vis,FW,FH-vis);g.globalAlpha=1;
      g.fillStyle='rgba(212,239,255,.9)';g.fillRect(fx-6,fy-sub,13,1);g.fillStyle='rgba(33,95,147,.55)';g.fillRect(fx-7,fy-sub+1,15,1);
    }else g.drawImage(sheet,sxs,sys,FW,FH,dx0,dy0,FW,FH);
  }
  while(i<objs.length)drawObj(objs[i++]);
  for(const f of fish){const u=f.t/f.dur,h=4*f.h*u*(1-u),pose=u<.33?-1:u<.66?0:1;fishSpr(Math.round(f.x+f.dir*18*u-camX),Math.round(f.y-camY-h),f.dir,pose)}
  g.fillStyle='#eaf8ff';
  for(const q of parts)g.fillRect(Math.round(q.x-camX),Math.round(q.y-camY-q.z),1,q.z>8?2:1);
}
function frame(now){
  const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;
  try{if(!started){}else if(worldReady)step(dt,now/1000);else loading()}catch(e){console.error(e)}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
setTimeout(()=>{gen();p.x=spawn.x;p.y=spawn.y;chunks.clear();initFrogs();initLife();worldReady=true;last=performance.now()},60);

</script>
