<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AMANBRA</title>
<style>
:root{--bg:#0d2410;--fg:#e8f5d8;--btn:rgba(232,245,216,.22)}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden}
body{touch-action:none;user-select:none;-webkit-user-select:none;font-family:"Trebuchet MS",Verdana,sans-serif}
canvas{position:fixed;left:0;top:0;image-rendering:pixelated;background:#4d9a35}
button{font-family:inherit;color:var(--fg);background:var(--btn);border:2px solid var(--fg);touch-action:none;-webkit-tap-highlight-color:transparent}
button:active{background:var(--fg);color:var(--bg)}
#pad{position:fixed;left:calc(14px + env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,64px);gap:6px}
#pad button{border-radius:12px;font-size:24px}
#pad .u{grid-column:2;grid-row:1}#pad .l{grid-column:1;grid-row:2}#pad .d{grid-column:2;grid-row:2}#pad .r{grid-column:3;grid-row:2}
#act{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;align-items:flex-end;gap:14px}
#act .jump{width:92px;height:92px;border-radius:50%;font-size:15px;font-weight:bold;letter-spacing:1px}
#act .run{width:66px;height:66px;border-radius:50%;font-size:12px;font-weight:bold;margin-bottom:6px}
#fs{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));width:42px;height:42px;border-radius:10px;font-size:20px;opacity:.7}
@media (pointer:fine){#pad,#act{display:none}}
</style>
</head>
<body>
<canvas id="c" width="320" height="240"></canvas>
<div id="pad">
<button class="u" data-k="up" aria-label="Cima">▲</button>
<button class="l" data-k="left" aria-label="Esquerda">◀</button>
<button class="d" data-k="down" aria-label="Baixo">▼</button>
<button class="r" data-k="right" aria-label="Direita">▶</button>
</div>
<div id="act">
<button class="run" data-k="run" aria-label="Correr">CORRER</button>
<button class="jump" data-k="jump" aria-label="Pular">PULAR</button>
</div>
<button id="fs" aria-label="Tela cheia">⛶</button>
<script>

const cv=document.getElementById('c'),g=cv.getContext('2d');
g.imageSmoothingEnabled=false;
let W=320,H=240;const T=16;
function resize(){const S=Math.max(2,Math.round(Math.min(innerWidth,innerHeight)/240));W=Math.ceil(innerWidth/S);H=Math.ceil(innerHeight/S);cv.width=W;cv.height=H;cv.style.width=W*S+'px';cv.style.height=H*S+'px';g.imageSmoothingEnabled=false}
resize();addEventListener('resize',resize);addEventListener('orientationchange',resize);
document.getElementById('fs').addEventListener('click',()=>{const e=document.documentElement,r=e.requestFullscreen||e.webkitRequestFullscreen;try{if(document.fullscreenElement||document.webkitFullscreenElement)(document.exitFullscreen||document.webkitExitFullscreen).call(document);else if(r)r.call(e)}catch(_){}});
const SPEED=48;        // px/s (resolução lógica)
const STRIDE=3.5;      // px andados por frame de animação (pés acompanham o chão)
const FW=24,FH=28,NF=8;   // quadros 24x28, 8 frames
const ROW={down:0,left:1,right:2,up:3};
const IDLE={down:8,up:8,left:8,right:8};  // frame "parado" de cada direção
const FEET_ROW=26;     // última linha de pixels dos pés no sprite

/* ---- entrada ---- */
const keys={up:0,down:0,left:0,right:0,jump:0,run:0};
const KMAP={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',Space:'jump',ShiftLeft:'run',ShiftRight:'run'};
let lastAxis='v';
const axisOf=k=>(k==='left'||k==='right')?'h':(k==='up'||k==='down')?'v':'x';
addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const k=KMAP[e.code];if(!k)return;
  e.preventDefault();
  if(!keys[k]&&axisOf(k)!=='x')lastAxis=axisOf(k);
  keys[k]=1;
});
addEventListener('keyup',e=>{const k=KMAP[e.code];if(k){e.preventDefault();keys[k]=0}});
function releaseAll(){keys.up=keys.down=keys.left=keys.right=keys.jump=keys.run=0}
addEventListener('blur',releaseAll);
document.addEventListener('visibilitychange',()=>{if(document.hidden)releaseAll()});
document.querySelectorAll('[data-k]').forEach(b=>{
  const k=b.dataset.k;
  b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=1;if(axisOf(k)!=='x')lastAxis=axisOf(k);b.setPointerCapture(e.pointerId)});
  ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=0));
});
addEventListener('contextmenu',e=>e.preventDefault());

/* ---- aleatório determinístico ---- */
function rnd(x,y){let h=Math.imul(x|0,374761393)^Math.imul(y|0,668265263);h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296}

/* ---- mundo: [1]=grama [2]=terra [3]=areia [4]=água ---- */
const GRASS=1,DIRT=2,SAND=3,WATER=4;
const SEED=1337,NS=4;
const LAKE=.77,DIRTT=.66,SANDT=.745;
function hs(x,y,s){let h=Math.imul(x|0,374761393)^Math.imul(y|0,668265263)^Math.imul(s|0,1274126177);h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296}
function vn(x,y,s){const xi=Math.floor(x),yi=Math.floor(y),fx=x-xi,fy=y-yi,u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy);
  const a=hs(xi,yi,s),b=hs(xi+1,yi,s),c=hs(xi,yi+1,s),d=hs(xi+1,yi+1,s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
function fbm(x,y,s){return vn(x,y,s)*.57+vn(x*2.1+7.7,y*2.1+3.1,s+1)*.29+vn(x*4.3+1.3,y*4.3+9.9,s+2)*.14}
const sst=(a,b,x)=>{x=Math.min(1,Math.max(0,(x-a)/(b-a)));return x*x*(3-2*x)};
let NODES=new Map(),NCOUNT=0,mi=1e9,mj=1e9,mA,mB,mC,mD;
function node(i,j){
  let row=NODES.get(i);if(!row){row=new Map();NODES.set(i,row)}
  let n=row.get(j);if(n)return n;
  if(++NCOUNT>600000){NODES=new Map();NCOUNT=0;row=new Map();NODES.set(i,row);mi=1e9}
  const x=i*NS,y=j*NS;
  const wx=x+(vn(x/70,y/70,SEED+1)-.5)*70,wy=y+(vn(x/70+31,y/70+17,SEED+2)-.5)*70;
  n=new Float32Array(7);
  n[0]=(fbm(wx/300,wy/300,SEED+10)-.5)*2;      // rio (distância assinada até o leito)
  n[1]=.010+.020*vn(x/160,y/160,SEED+11);        // largura do rio
  n[2]=.02+.03*vn(x/190,y/190,SEED+12);        // faixa de areia ao redor da água
  n[3]=fbm(wx/200,wy/200,SEED+13);             // lagos
  n[4]=fbm(wx/110,wy/110,SEED+14);             // manchas de terra
  n[5]=fbm(wx/130,wy/130,SEED+15);             // manchas de areia
  n[6]=1-sst(40,150,Math.hypot(x,y));          // clareira inicial (só grama)
  row.set(j,n);return n;
}
function terr(x,y){          // x,y inteiros em px do mundo → 1..4
  const fx=x/NS,fy=y/NS,i=Math.floor(fx),j=Math.floor(fy),u=fx-i,v=fy-j;
  if(i!==mi||j!==mj){mi=i;mj=j;mA=node(i,j);mB=node(i+1,j);mC=node(i,j+1);mD=node(i+1,j+1)}
  const A=mA,B=mB,C=mC,D=mD,w0=(1-u)*(1-v),w1=u*(1-v),w2=(1-u)*v,w3=u*v;
  const jit=(vn(x/5,y/5,SEED+30)-.5)*.03,b=(A[6]*w0+B[6]*w1+C[6]*w2+D[6]*w3)*.7;
  const r=Math.abs(A[0]*w0+B[0]*w1+C[0]*w2+D[0]*w3)+b+jit;
  const rw=A[1]*w0+B[1]*w1+C[1]*w2+D[1]*w3;
  if(r<rw)return WATER;
  const lk=A[3]*w0+B[3]*w1+C[3]*w2+D[3]*w3-b+jit;
  if(lk>LAKE)return WATER;
  if(r<rw+(A[2]*w0+B[2]*w1+C[2]*w2+D[2]*w3)||lk>LAKE-.035)return SAND;
  if(A[4]*w0+B[4]*w1+C[4]*w2+D[4]*w3-b+jit>DIRTT)return DIRT;
  if(A[5]*w0+B[5]*w1+C[5]*w2+D[5]*w3-b+jit>SANDT)return SAND;
  return GRASS;
}

/* ---- texturas (paleta tirada do tileset) ---- */
const CS=128,BD=2,chunks=new Map();
const HX=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const C={g0:HX('#4d9a35'),g1:HX('#478f32'),g2:HX('#55a23b'),gl:HX('#6bb84a'),gd:HX('#3a7d2a'),gr:HX('#3a7d2a'),fy:HX('#f4e04d'),fw:HX('#f0f0f6'),
 s0:HX('#f3d98f'),s1:HX('#e9c97c'),s2:HX('#fae495'),sw:HX('#d3ae5e'),sm:HX('#e2c06e'),sp:HX('#b8a27a'),
 d0:HX('#745231'),d1:HX('#6a4829'),d2:HX('#7f5c38'),dr:HX('#4f3219'),dp:HX('#8d8d88'),
 w0:HX('#2f87d6'),w1:HX('#2a7bcb'),wr:HX('#1d5fa6'),wm:HX('#2873c4'),wl:HX('#8ccaf5')};
function shade(ids,N,i,j,wx,wy,f){
  const o=j*N+i,t=ids[o],h=hs(wx,wy,5),a=ids[o-1],b=ids[o+1],c=ids[o-N],d=ids[o+N];
  if(t===WATER){
    if(a!==4||b!==4||c!==4||d!==4)return C.wr;
    if(ids[o-2]!==4||ids[o+2]!==4||ids[o-2*N]!==4||ids[o+2*N]!==4)return C.wm;
    if((wy&1)===0&&(wx&3)<3&&hs(wx>>2,wy>>1,9)>.9&&((hs(wx>>2,wy>>1,10)*2)|0)===f)return C.wl;
    return h<.2?C.w1:C.w0;
  }
  if(t===SAND){
    if(a===4||b===4||c===4||d===4)return C.sw;
    if(ids[o-2]===4||ids[o+2]===4||ids[o-2*N]===4||ids[o+2*N]===4)return C.sm;
    if(h>.9985)return C.sp;
    return h<.12?C.s1:h>.9?C.s2:C.s0;
  }
  if(t===DIRT){
    if(a!==2||b!==2||c!==2||d!==2)return C.dr;
    if(h>.9975)return C.dp;
    return h<.14?C.d1:h>.88?C.d2:C.d0;
  }
  if(a!==1||b!==1||c!==1||d!==1)return C.gr;
  if(hs(wx,wy,6)>.975)return C.gl;
  if(hs(wx,wy-1,6)>.975)return C.gd;
  const fl=hs(wx,wy,7);if(fl>.9995)return C.fw;if(fl>.9988)return C.fy;
  return h<.15?C.g1:h<.3?C.g2:C.g0;
}
function makeChunk(cx,cy){            // ids com borda de 2px: as bordas entre chunks são contínuas (sem emenda)
  const N=CS+2*BD,ids=new Uint8Array(N*N),X0=cx*CS-BD,Y0=cy*CS-BD;
  for(let y=0;y<N;y++)for(let x=0;x<N;x++)ids[y*N+x]=terr(X0+x,Y0+y);
  return [0,1].map(f=>{
    const c=document.createElement('canvas');c.width=c.height=CS;
    const x=c.getContext('2d'),im=x.createImageData(CS,CS),d=im.data;
    for(let y=0;y<CS;y++)for(let xx=0;xx<CS;xx++){
      const col=shade(ids,N,xx+BD,y+BD,cx*CS+xx,cy*CS+y,f),q=(y*CS+xx)*4;
      d[q]=col[0];d[q+1]=col[1];d[q+2]=col[2];d[q+3]=255;
    }
    x.putImageData(im,0,0);return c;
  });
}
function chunk(cx,cy){const k=cx+','+cy;let c=chunks.get(k);if(!c){c=makeChunk(cx,cy);chunks.set(k,c)}return c}
function drawGround(camX,camY,fi){
  const cx0=Math.floor(camX/CS),cx1=Math.floor((camX+W-1)/CS),cy0=Math.floor(camY/CS),cy1=Math.floor((camY+H-1)/CS);
  for(let cy=cy0;cy<=cy1;cy++)for(let cx=cx0;cx<=cx1;cx++)g.drawImage(chunk(cx,cy)[fi],cx*CS-camX,cy*CS-camY);
  let n=0;                                   // pré-carrega 1 chunk vizinho por quadro (sem engasgo)
  for(let cy=cy0-1;cy<=cy1+1&&n<1;cy++)for(let cx=cx0-1;cx<=cx1+1&&n<1;cx++)if(!chunks.has(cx+','+cy)){chunk(cx,cy);n++}
  if(chunks.size>48)for(const k of chunks.keys()){const [a,b]=k.split(',').map(Number);if(a<cx0-2||a>cx1+2||b<cy0-2||b>cy1+2)chunks.delete(k)}
}
const isG=(x,y)=>terr(x,y)===GRASS;
function tuft(x,y){
  g.fillStyle='#1d5f20';g.fillRect(x+3,y+8,1,6);g.fillRect(x+7,y+5,1,9);g.fillRect(x+11,y+8,1,6);
  g.fillStyle='#43ac43';g.fillRect(x+4,y+9,1,5);g.fillRect(x+8,y+6,1,8);g.fillRect(x+10,y+9,1,5);
}

/* ---- formas em pixel (elipses sem serrilhado borrado) ---- */
function ell(cx,cy,rx,ry,col){
  g.fillStyle=col;
  for(let dy=-ry;dy<=ry;dy++){const hw=Math.round(rx*Math.sqrt(1-(dy*dy)/((ry+.5)*(ry+.5))));g.fillRect(cx-hw,cy+dy,hw*2+1,1)}
}
function rock(x,y){ell(x,y-1,7,2,'rgba(0,25,0,.28)');ell(x,y-4,6,4,'#5f6559');ell(x,y-5,5,3,'#7d8374');ell(x-2,y-6,2,1,'#a3a995')}
function bush(x,y){
  ell(x,y-1,10,3,'rgba(0,25,0,.28)');ell(x,y-6,9,6,'#1b5420');ell(x-2,y-8,6,4,'#2a7d30');ell(x-3,y-10,3,2,'#46a84a');
  g.fillStyle='#c8372d';g.fillRect(x+3,y-7,2,2);g.fillRect(x-5,y-4,2,2);g.fillRect(x+6,y-4,2,2);
}

/* ---- personagem ---- */
const sheet=new Image();let ready=false;

      if(terr(bx,by)!==WATER&&terr(bx-7,by)!==WATER&&terr(bx+7,by)!==WATER&&terr(bx,by-8)!==WATER)objs.push({y:sy+T-2,d:()=>rock(sx+8,sy+T-2)});
    }else if(r>.972){
      if(isG(bx,by)&&isG(bx-9,by)&&isG(bx+9,by)&&isG(bx,by-10))objs.push({y:sy+T-2,d:()=>bush(sx+8,sy+T-2)});
    }
  }
  objs.sort((a,b)=>a.y-b.y);
  const fx=W/2,fy=H/2;
  for(const r of rings)if(r.t>=0)ring(r.x-camX,r.y-camY,2+r.t*16,1-r.t/.8);
  let i=0;
  while(i<objs.length&&objs[i].y<=fy)objs[i++].d();
  if(!p.swim&&sub<2){const k=Math.min(3,Math.round(p.z/5));ell(fx,fy-1,8-k,3-(k>2?1:0),'rgba(0,25,0,.22)');ell(fx,fy-1,5-k,2,'rgba(0,25,0,.30)')}
  if(ready){
    let a=0,f;
    if(p.swim){a=3;f=Math.floor(p.t*(p.moving?9:4))%8}
    else if(p.z>0){a=2;f=p.vz>70?1:p.vz>20?2:p.vz>-40?3:4}
    else if(p.land>0){a=2;f=5}
    else if(p.moving&&running){a=1;f=Math.floor(p.dist/STRIDE_RUN)%NF}
    else{a=0;f=p.moving?Math.floor(p.dist/STRIDE)%NF:8}
    const sxs=f*FW,sys=(a*4+DIRI[p.face])*FH,dx0=fx-FW/2,dy0=fy-FEET_ROW-1-Math.round(p.z);
    if(sub>0){
      const vis=FEET_ROW+1-sub;
      g.drawImage(sheet,sxs,sys,FW,vis,dx0,dy0,FW,vis);
      g.globalAlpha=.3;g.drawImage(sheet,sxs,sys+vis,FW,FH-vis,dx0,dy0+vis,FW,FH-vis);g.globalAlpha=1;
      g.fillStyle='rgba(140,202,245,.9)';g.fillRect(fx-6,fy-sub,13,1);
      g.fillStyle='rgba(29,95,166,.55)';g.fillRect(fx-7,fy-sub+1,15,1);
    }else g.drawImage(sheet,sxs,sys,FW,FH,dx0,dy0,FW,FH);
  }
  while(i<objs.length)objs[i++].d();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
